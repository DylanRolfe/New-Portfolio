      <picture>
        <source media="(orientation: portrait)" srcset="assets/cinematic/Images/painting-mobile.webp"
                data-mask="assets/cinematic/Images/sky-mobile.png" data-flow="assets/cinematic/Images/flow-mobile.png">
        <img class="cinematic-painting" src="assets/cinematic/Images/painting-desktop.webp" alt=""
             data-mask="assets/cinematic/Images/sky-desktop.png" data-flow="assets/cinematic/Images/flow-desktop.png">
      </picture>
      <canvas class="cinematic-canvas"></canvas>
    </div>
    <div class="site-backdrop-scrim"></div>
  </div>

  <nav class="nav nav-solid" id="nav" aria-label="primary navigation">
    <div class="nav-inner">

        <span></span><span></span>

    </div>

  <main id="main" class="touch-main">
    <section class="section page-section touch-section">
      <div class="container touch-inner reveal">
        <h1 class="section-title">follow the journey</h1>
        <p class="touch-copy">follow along for monthly newsletters.</p>
        <a class="button button-substack" href="https://substack.com/@dylanrolfe" target="_blank" rel="noopener noreferrer">
          <svg class="substack-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z" />
          </svg>
          open substack
        </a>
      </div>
    </section>
    <section class="section life" id="life">
      <div class="container">
        <div class="section-heading reveal">
          <h2 class="section-title">outside the workshop</h2>
          <p class="section-sub">a slow belt of places, projects, and moments — click a photo to zoom.</p>
        </div>
      </div>

      <div
        class="life-belt reveal"
        data-life-belt
        aria-label="outside the workshop media belt"
      >
        <div class="life-belt-track">
          <div class="life-belt-set">
            <figure class="life-card">
              <button class="life-photo" type="button" data-lightbox-src="Images/Mountain.jpg" data-lightbox-alt="Tent pitched above a sea of clouds" aria-label="open photo: new biome unlocked">
                <img src="Images/Mountain.jpg" width="2160" height="2880" alt="Tent pitched above a sea of clouds" loading="lazy" decoding="async" />
              </button>
              <figcaption>new biome unlocked</figcaption>
            </figure>

            <figure class="life-card life-card-portrait">
              <button class="life-photo" type="button" data-lightbox-src="Images/3dprint.jpg" data-lightbox-alt="A full 3D-printed Batman figure on a desk" aria-label="open photo: a 3d-printed batman">
                <img src="Images/3dprint.jpg" width="2160" height="2880" alt="A full 3D-printed Batman figure on a desk" loading="lazy" decoding="async" />
              </button>
              <figcaption>a 3d-printed batman</figcaption>
            </figure>

            <figure class="life-card">
              <button class="life-photo" type="button" data-lightbox-src="Images/Tentview.jpg" data-lightbox-alt="Sunrise over mountains from inside a tent" aria-label="open photo: just an average morning">
                <img src="Images/Tentview.jpg" width="1656" height="2208" alt="Sunrise over mountains from inside a tent" loading="lazy" decoding="async" />
              </button>
              <figcaption>just an average morning</figcaption>
            </figure>

            <figure class="life-card">
              <button class="life-photo" type="button" data-lightbox-src="Images/view.jpg" data-lightbox-alt="Looking toward a glacier in Alaska" aria-label="open photo: feeling small in the best way">
                <img src="Images/view.jpg" width="2160" height="2880" alt="Looking toward a glacier in Alaska" loading="lazy" decoding="async" />
              </button>
              <figcaption>feeling small in the best way</figcaption>
            </figure>

            <figure class="life-card life-card-video">
              <div class="life-video">
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="auto"
                  src="Images/CanSat-launch.mp4"
                  width="1080"
                  height="1920"
                  aria-label="cansat rocket launch"
                ></video>
              </div>
              <figcaption>launching rockets</figcaption>
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="photo viewer">
    <button class="lightbox-close" type="button" aria-label="close photo">×</button>
    <img class="lightbox-image" src="" alt="" />
    <p class="lightbox-caption"></p>
  </dialog>
